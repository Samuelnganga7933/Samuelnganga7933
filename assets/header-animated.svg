<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00c6ff;#7b2ff7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2b86f5">
        <animate attributeName="stop-color" values="#2b86f5;#8ef7a7;#2b86f5" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grad)" />

  <!-- animated soft blobs -->
  <g filter="url(#blur)" opacity="0.7">
    <circle cx="220" cy="140" r="120" fill="#ffffff" opacity="0.08">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" dur="10s" values="0 0; 60 -20; -40 30; 0 0" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="90" r="140" fill="#000000" opacity="0.06">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" dur="12s" values="0 0; -80 30; 50 -20; 0 0" repeatCount="indefinite" />
    </circle>
    <circle cx="1180" cy="180" r="100" fill="#ffffff" opacity="0.06">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" dur="9s" values="0 0; 40 20; -30 -10; 0 0" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- subtle moving dots -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="360" cy="300" r="4">
      <animate attributeName="cx" dur="7s" values="360;420;360" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="320" r="3">
      <animate attributeName="cx" dur="6s" values="940;880;940" repeatCount="indefinite" />
    </circle>
    <circle cx="1260" cy="80" r="5">
      <animate attributeName="cy" dur="8s" values="80;120;80" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- text block -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" text-anchor="middle" fill="#ffffff">
    <text x="800" y="150" font-size="44" font-weight="700" style="letter-spacing:0.6px">Samuel Nganga</text>
    <text x="800" y="200" font-size="20" font-weight="500" opacity="0.95">CT student @ MMU Kenya • Builder • Designer</text>

    <!-- small badges-like text -->
    <g transform="translate(800,240)" text-anchor="middle">
      <rect x="-320" y="-28" rx="10" ry="10" width="640" height="56" fill="#ffffff" opacity="0.06" />
      <text x="0" y="10" font-size="14" fill="#ffffff">PHP · JavaScript · React · Laravel · Tailwind · Docker · MySQL</text>
    </g>
  </g>

  <!-- decorative underline animation -->
  <line x1="520" y1="220" x2="1080" y2="220" stroke="#ffffff" stroke-width="1.5" opacity="0.12">
    <animate attributeName="x1" dur="6s" values="520;540;520" repeatCount="indefinite" />
    <animate attributeName="x2" dur="6s" values="1080;1060;1080" repeatCount="indefinite" />
  </line>

  <!-- accessibility title -->
  <title>Samuel Nganga — CT student at MMU Kenya. Portfolio and projects.</title>
</svg>
