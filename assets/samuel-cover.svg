<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Samuel Nganga</title>
  <desc id="desc">Editorial cover in black, cream, and red.</desc>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f1e9"/><stop offset="1" stop-color="#e8dfd3"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".65" fill="#111" opacity=".07"/><circle cx="7" cy="8" r=".45" fill="#111" opacity=".05"/></pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#cream)"/>
    <rect width="1200" height="300" fill="url(#grain)"/>
    <rect x="792" y="-40" width="260" height="390" fill="#d53b30" transform="rotate(18 792 -40)"/>
    <circle cx="1020" cy="155" r="88" fill="#111"/>
    <circle cx="1020" cy="155" r="58" fill="none" stroke="#f5f1e9" stroke-width="2" opacity=".75"/>
    <path d="M0 255 C150 212 250 287 390 237 S625 195 770 247" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M0 265 C150 222 250 297 390 247 S625 205 770 257" fill="none" stroke="#d53b30" stroke-width="2"/>
    <text x="52" y="46" fill="#d53b30" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="4">NOTES FROM THE DESK / 2026</text>
    <text x="47" y="148" fill="#111" font-family="Georgia,Times New Roman,serif" font-size="84" font-weight="700" letter-spacing="-4">SAMUEL</text>
    <text x="53" y="202" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="9">NGANGA</text>
    <text x="54" y="264" fill="#f5f1e9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="3">USEFUL THINGS / GOOD TASTE / KEEP GOING</text>
    <text x="1138" y="245" fill="#f5f1e9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2" transform="rotate(-90 1138 245)">MAKE IT FEEL SIMPLE</text>
